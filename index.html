<!doctype html>
<html lang="km" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />

    <!-- Preload splash logo at highest priority so it appears immediately -->
    <link rel="preload" as="image" href="/app_logo.png" fetchpriority="high" />
    
    <!-- Mobile App Viewport & iOS / Android Fullscreen Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ចាប់ស្លាកលេខ" />
    <meta name="application-name" content="ចាប់ស្លាកលេខ" />
    <meta name="theme-color" content="#291006" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <title>ប្រព័ន្ធគ្រប់គ្រងស្លាកលេខ និងទីតាំង | Tag & Location Manager</title>
    
    <!-- Google Fonts for Khmer Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:ital,wght@0,300..700;1,300..700&family=Moul&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-950 font-kantumruy select-none notranslate" translate="no">
    <!-- Initial loader: shown immediately, removed by main.jsx once React mounts -->
    <div id="initial-loader" style="position:fixed;inset:0;z-index:99999;background:#020617;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;">
      <img src="/app_logo.png" alt="ចាប់ស្លាកលេខ" style="width:96px;height:96px;object-fit:contain;border-radius:50%;filter:drop-shadow(0 0 24px rgba(245,158,11,0.6));animation:_spin 2.5s ease-in-out infinite alternate;" />
      <div style="display:flex;gap:6px;align-items:center;">
        <div style="width:8px;height:8px;border-radius:50%;background:#f59e0b;animation:_dot 1.2s ease-in-out infinite;"></div>
        <div style="width:8px;height:8px;border-radius:50%;background:#f59e0b;animation:_dot 1.2s ease-in-out 0.2s infinite;"></div>
        <div style="width:8px;height:8px;border-radius:50%;background:#f59e0b;animation:_dot 1.2s ease-in-out 0.4s infinite;"></div>
      </div>
      <style>
        @keyframes _spin{0%{transform:scale(1) rotate(-3deg)}100%{transform:scale(1.08) rotate(3deg)}}
        @keyframes _dot{0%,100%{opacity:.2;transform:scale(0.7)}50%{opacity:1;transform:scale(1)}}
      </style>
    </div>

    <div id="root" class="notranslate" translate="no"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch(err => console.log('SW error:', err));
        });
      }
    </script>
  </body>
</html>
